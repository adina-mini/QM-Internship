<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QM Assistant</title>
    <style>
        :root {
            --bg-deep: #DED5CE;
            --bg-panel: #F3EEEA;
            --bg-bubble-bot: #E8E0DA;
            --accent: #AB94A6;
            --accent-soft: #C7B4C2;
            --text-main: #4A3F47;
            --text-muted: #8C7C87;
            --success: #AB94A6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ::selection {
            background: var(--accent-soft);
        }

        #chat-widget {
            width: 400px;
            height: 620px;
            background: var(--bg-panel);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(74, 63, 71, 0.18);
            border: 1px solid rgba(74, 63, 71, 0.08);
        }

        #chat-header {
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--accent-soft), var(--bg-panel));
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(74, 63, 71, 0.08);
        }

        #chat-header .butterfly {
            font-size: 20px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 4px rgba(171, 148, 166, 0.5));
            animation: flutter 3s ease-in-out infinite;
        }

        @keyframes flutter {

            0%,
            100% {
                transform: rotate(-6deg) scale(1);
            }

            50% {
                transform: rotate(6deg) scale(1.08);
            }
        }

        #chat-header .title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-main);
        }

        #chat-header .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--accent-soft);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.bot {
            background: var(--bg-bubble-bot);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.user {
            background: var(--accent);
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.typing {
            background: var(--bg-bubble-bot);
            color: var(--text-muted);
            align-self: flex-start;
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: 0.3;
            }

            30% {
                opacity: 1;
            }
        }

        #starter-questions {
            padding: 0 18px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: var(--accent-soft);
            color: var(--text-main);
            border: none;
            border-radius: 20px;
            padding: 7px 13px;
            font-size: 12.5px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chip:hover {
            background: var(--accent);
            color: #FFFFFF;
        }

        #input-row {
            display: flex;
            padding: 14px;
            gap: 8px;
            border-top: 1px solid rgba(74, 63, 71, 0.08);
        }

        #user-input {
            flex: 1;
            background: var(--bg-bubble-bot);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        #user-input:focus {
            border-color: var(--accent);
        }

        #send-btn {
            background: var(--accent);
            border: none;
            border-radius: 12px;
            width: 44px;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div id="chat-widget">
        <div id="chat-header">
            <div class="butterfly">💃</div>
            <div>
                <div class="title">QM Assistant</div>
                <div class="subtitle">Ask about our services, team, or projects</div>
            </div>
        </div>

        <div id="messages"></div>
        <div id="starter-questions"></div>

        <div id="input-row">
            <input id="user-input" type="text" placeholder="Type your question..." />
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000"; // change to your deployed URL later
        const SESSION_ID = "web_" + Math.random().toString(36).slice(2);

        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chipsEl = document.getElementById("starter-questions");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "msg " + sender;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "msg typing";
            div.id = "typing-indicator";
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            addMessage(text, "user");
            inputEl.value = "";
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: SESSION_ID })
                });
                const data = await res.json();
                removeTyping();
                addMessage(data.reply || "Something went wrong — please try again.", "bot");
            } catch (err) {
                removeTyping();
                addMessage("Connection error — is the server running?", "bot");
            }
            sendBtn.disabled = false;
        }

        sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage(inputEl.value);
        });

        // Load starter question chips from backend
        async function loadStarterQuestions() {
            try {
                const res = await fetch(`${API_BASE}/starter-questions`);
                const data = await res.json();
                (data.questions || []).forEach(q => {
                    const btn = document.createElement("button");
                    btn.className = "chip";
                    btn.textContent = q;
                    btn.addEventListener("click", () => {
                        chipsEl.style.display = "none";
                        sendMessage(q);
                    });
                    chipsEl.appendChild(btn);
                });
            } catch (err) {
                console.warn("Could not load starter questions:", err);
            }
        }

        addMessage("Hi! I'm the QM Assistant. Ask me anything about our services, projects, or how to get in touch.", "bot");
        loadStarterQuestions();
    </script>

</body>

</html>
