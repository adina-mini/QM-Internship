<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QM Assistant</title>
    <style>
        :root {
            --teal: #14919B;
            --navy: #162466;
            --orange: #FFA520;
            --bg-white: #FFFFFF;
            --bg-soft: #F4F7F8;
            --bg-bubble-bot: #EFF4F5;
            --text-main: #162466;
            --text-muted: #7A8699;
            --border-soft: #E3E9EC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent;
        }

        /* ---- Floating launcher icon ---- */
        #launcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--teal);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(22, 36, 102, 0.25);
            transition: transform 0.2s;
            z-index: 9999;
        }

        #launcher:hover {
            transform: scale(1.06);
        }

        #launcher svg {
            width: 28px;
            height: 28px;
        }

        #launcher .notify-dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: var(--orange);
            border-radius: 50%;
            border: 2px solid white;
        }

        /* ---- Chat window ---- */
        #chat-widget {
            position: fixed;
            bottom: 96px;
            right: 24px;
            width: 380px;
            height: 580px;
            background: var(--bg-white);
            border-radius: 16px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(22, 36, 102, 0.22);
            border: 1px solid var(--border-soft);
            z-index: 9999;
        }

        #chat-widget.open {
            display: flex;
        }

        #chat-header {
            padding: 14px 16px;
            background: var(--teal);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-header img.logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            flex-shrink: 0;
        }

        #chat-header .title-block {
            flex: 1;
        }

        #chat-header .title {
            font-weight: 600;
            font-size: 14.5px;
            color: white;
        }

        #chat-header .subtitle {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 1px;
        }

        #close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            opacity: 0.9;
        }

        #close-btn:hover {
            opacity: 1;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-soft);
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--border-soft);
            border-radius: 10px;
        }

        .msg {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.bot {
            background: var(--bg-bubble-bot);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.bot ul {
            margin: 6px 0 0 18px;
            padding: 0;
        }

        .msg.bot li {
            margin-bottom: 3px;
        }

        .msg.bot strong {
            font-weight: 700;
        }

        .msg.user {
            background: var(--teal);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.typing {
            background: var(--bg-bubble-bot);
            align-self: flex-start;
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            60%,
            100% {
                opacity: 0.3;
            }

            30% {
                opacity: 1;
            }
        }

        #starter-questions {
            padding: 0 16px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            background: var(--bg-soft);
        }

        .chip {
            background: white;
            color: var(--teal);
            border: 1px solid var(--teal);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .chip:hover {
            background: var(--teal);
            color: white;
        }

        /* ---- Action buttons under bot messages ---- */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            max-width: 82%;
        }

        /* Default: teal outline — used for all normal service buttons */
        .action-btn {
            display: inline-block;
            background: white;
            color: var(--teal);
            border: 1.5px solid var(--teal);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.15s, color 0.15s;
        }

        .action-btn:hover {
            background: var(--teal);
            color: white;
        }

        /* Book a Consultation button — same teal style as service buttons, but two lines:
     a small caption above the bold label, both inside one pill button. */
        .action-btn.consult-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 14px;
            line-height: 1.3;
        }

        .action-btn.consult-btn .consult-prompt {
            font-size: 10px;
            font-weight: 500;
            opacity: 0.75;
        }

        .action-btn.consult-btn .consult-label {
            font-size: 12.5px;
            font-weight: 700;
        }

        #input-row {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-top: 1px solid var(--border-soft);
            background: white;
        }

        #user-input {
            flex: 1;
            background: var(--bg-soft);
            border: 1px solid var(--border-soft);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 13.5px;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        #user-input:focus {
            border-color: var(--teal);
        }

        #send-btn {
            background: var(--teal);
            border: none;
            border-radius: 10px;
            width: 40px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #disclaimer {
            text-align: center;
            font-size: 10.5px;
            color: #444444;
            padding: 6px 10px 10px;
            background: white;
        }
    </style>
</head>

<body>

    <div id="launcher">
        <div class="notify-dot"></div>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4H20C21.1 4 22 4.9 22 6V16C22 17.1 21.1 18 20 18H8L4 22V6C4 4.9 4.9 4 4 4Z" fill="white"
                stroke="white" stroke-width="0.5" stroke-linejoin="round" />
            <circle cx="9" cy="11" r="1.3" fill="#14919B" />
            <circle cx="13" cy="11" r="1.3" fill="#14919B" />
            <circle cx="17" cy="11" r="1.3" fill="#14919B" />
        </svg>
    </div>

    <div id="chat-widget">
        <div id="chat-header">
            <img class="logo" src="logo.png" alt="QM Logics logo" />
            <div class="title-block">
                <div class="title">QM Logics</div>
                <div class="subtitle">Your AI Partner</div>
            </div>
            <button id="close-btn">&times;</button>
        </div>

        <div id="messages"></div>
        <div id="starter-questions"></div>

        <div id="input-row">
            <input id="user-input" type="text" placeholder="Type your message..." />
            <button id="send-btn">➤</button>
        </div>
        <div id="disclaimer">AI-generated replies — please verify important details.</div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000"; // change to your deployed URL later
        const SESSION_ID = "web_" + Math.random().toString(36).slice(2);

        const launcherEl = document.getElementById("launcher");
        const widgetEl = document.getElementById("chat-widget");
        const closeBtn = document.getElementById("close-btn");
        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chipsEl = document.getElementById("starter-questions");

        let hasOpenedBefore = false;

        launcherEl.addEventListener("click", () => {
            widgetEl.classList.add("open");
            launcherEl.style.display = "none";
            if (!hasOpenedBefore) {
                hasOpenedBefore = true;
                addMessage("Hi there! 👋 Welcome to QM Logics. How can I help you today?", "bot");
                loadStarterQuestions();
            }
        });

        closeBtn.addEventListener("click", () => {
            widgetEl.classList.remove("open");
            launcherEl.style.display = "flex";
        });

        function renderMarkdown(text) {
            // Escape HTML first to avoid injection, then apply light markdown formatting
            const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const lines = escaped.split("\n");
            let html = "";
            let inList = false;
            for (const line of lines) {
                const bulletMatch = line.match(/^\s*[-*]\s+(.*)/);
                if (bulletMatch) {
                    if (!inList) { html += "<ul>"; inList = true; }
                    html += `<li>${bulletMatch[1]}</li>`;
                } else {
                    if (inList) { html += "</ul>"; inList = false; }
                    if (line.trim() === "") { html += "<br/>"; }
                    else { html += line + "<br/>"; }
                }
            }
            if (inList) html += "</ul>";
            // Bold: **text** -> <strong>text</strong>
            html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            return html;
        }

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "msg " + sender;
            if (sender === "bot") {
                div.innerHTML = renderMarkdown(text);
            } else {
                div.textContent = text;
            }
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "msg typing";
            div.id = "typing-indicator";
            div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        function hideStarterQuestions() {
            chipsEl.style.display = "none";
        }

        function addActionButtons(actions) {
            if (!actions || actions.length === 0) return;
            const wrap = document.createElement("div");
            wrap.className = "action-buttons";
            actions.forEach(action => {
                const a = document.createElement("a");
                const isConsultButton = action.label.toLowerCase().includes("consultation");
                a.href = action.url;
                a.target = "_blank";
                a.rel = "noopener";
                if (isConsultButton) {
                    a.className = "action-btn consult-btn";
                    a.innerHTML = `<span class="consult-prompt">Interested? Let's talk</span><span class="consult-label">${action.label}</span>`;
                } else {
                    a.className = "action-btn";
                    a.textContent = action.label;
                }
                wrap.appendChild(a);
            });
            messagesEl.appendChild(wrap);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            hideStarterQuestions();
            addMessage(text, "user");
            inputEl.value = "";
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: SESSION_ID })
                });
                const data = await res.json();
                removeTyping();
                addMessage(data.reply || "Something went wrong — please try again.", "bot");
                addActionButtons(data.actions);
            } catch (err) {
                removeTyping();
                addMessage("Connection error — is the server running?", "bot");
            }
            sendBtn.disabled = false;
        }

        sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage(inputEl.value);
        });

        async function loadStarterQuestions() {
            try {
                const res = await fetch(`${API_BASE}/starter-questions`);
                const data = await res.json();
                (data.questions || []).forEach(q => {
                    const btn = document.createElement("button");
                    btn.className = "chip";
                    btn.textContent = q;
                    btn.addEventListener("click", () => sendMessage(q));
                    chipsEl.appendChild(btn);
                });
            } catch (err) {
                console.warn("Could not load starter questions:", err);
            }
        }
    </script>

</body>

</html>
